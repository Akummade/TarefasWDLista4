<!DOCTYPE html>
<html>
    <head>
    </head>
    <body>
        <div id="formulário" class="painel">
            <div>Meus feitiços</div>
                <div>
                Feitiços: <input type="text">
                Nível: <input type="text">
                <span onclick="inserir()">Adicionar</span>
                </div>
        </div>

        <div>
        <div>
        <div>
        <table id="tabela">
            <tr><th>Feitiço</th><th>Nível</th></tr>
        </table>
        </div>
        </div>
        </div>
        <script>
            function inserir() {

            let feit = document.getElementsByTagName("input")[0].value;
            let nivel = document.getElementsByTagName("input")[1].value;

            let tabela = document.getElementById("tabela");
            let linha = document.createElement("tr");

            let td1 = document.createElement("td");
            let td2 = document.createElement("td");

            td1.innerHTML = feit;
            td2.innerHTML = nivel;

            linha.appendChild(td1);
            linha.appendChild(td2);

            tabela.appendChild(linha);
        }
        </script>
    </body>
</html>

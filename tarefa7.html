<!DOCTYPE html>
<html lang="en">
    <head>

    </head>
    <body>
        <button onclick="verde()">Verde</button>
        <button onclick="vermelho()">Vermelho</button>
        <button onclick="azul()">Azul</button>
        <div style="border: 2px solid black; width: 100px; height: 100px;"></div>
        <script>
            function verde() {
                document.getElementsByTagName("div")[0].style.backgroundColor = "green";
            }

            function vermelho() {
                document.getElementsByTagName("div")[0].style.backgroundColor = "red";
            }

            function azul() {
                document.getElementsByTagName("div")[0].style.backgroundColor = "blue";
            }
        </script>
    </body>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>

    </head>
    <body>
        <input type="text" id="input" placeholder="Digite um texto">
        <button onclick="verificar(input.value)">Verificar</button>
        <div id="letra">Letras: </div>
        <div id="numeros">Números: </div>
        <script>
            function verificar(texto){
                let alphabet = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
                if(alphabet.includes(texto)){
                    document.getElementById("letra").innerHTML += texto + " ";
                } else if(!isNaN(texto) && texto.trim() !== ""){
                    document.getElementById("numeros").innerHTML += texto + " ";
                }
            }
        </script>
    </body>
    </body>
</html>
